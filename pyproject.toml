[project]
name = "agent-filetree-memory-mcp"
version = "0.4.0"
description = "Encrypted, capability-scoped, versioned Markdown file-tree memory for MCP agents"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<3.14"
authors = [{ name = "Emilio Esposito" }]
keywords = ["agent", "memory", "mcp", "markdown", "postgresql"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "cryptography>=49.0.0,<51",
    "PyJWT[crypto]>=2.13.0,<3",
    "typing_extensions>=4.12,<5; python_version < '3.12'",
]

[project.urls]
Homepage = "https://github.com/EmilioEsposito/agent-filetree-memory-mcp"
Documentation = "https://github.com/EmilioEsposito/agent-filetree-memory-mcp/tree/main/docs"
Repository = "https://github.com/EmilioEsposito/agent-filetree-memory-mcp.git"
Issues = "https://github.com/EmilioEsposito/agent-filetree-memory-mcp/issues"

[project.optional-dependencies]
postgres = [
    "alembic>=1.18.5,<2",
    "asyncpg>=0.31.0,<0.32",
    "SQLAlchemy[asyncio]>=2.0.51,<2.1",
]
mcp = ["fastmcp==3.4.2"]
app = [
    "fastmcp[apps]==3.4.2",
    "prefab-ui==0.20.2",
]
web = [
    "alembic>=1.18.5,<2",
    "asyncpg>=0.31.0,<0.32",
    "fastapi==0.141.1",
    "SQLAlchemy[asyncio]>=2.0.51,<2.1",
    "uvicorn==0.52.4",
]
all = [
    "alembic>=1.18.5,<2",
    "asyncpg>=0.31.0,<0.32",
    "SQLAlchemy[asyncio]>=2.0.51,<2.1",
    "fastapi==0.141.1",
    "fastmcp[apps]==3.4.2",
    "prefab-ui==0.20.2",
    "uvicorn==0.52.4",
]

[project.scripts]
agent-filetree-memory-mcp = "agent_filetree_memory.cli:main"
agent-filetree-memory-janitor = "agent_filetree_memory.janitor_cli:main"

[dependency-groups]
dev = [
    "agent-filetree-memory-mcp[all]",
    "build>=1.3.0,<2",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_filetree_memory"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/examples",
    "/docs",
    "/web-ui",
    "/README.md",
    "/SECURITY.md",
    "/LICENSE",
    "/pyproject.toml",
]
exclude = ["/web-ui/node_modules"]

[tool.uv]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.sources]
agent-filetree-memory-mcp = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
addopts = "-q -m 'not live'"
markers = ["live: uses a real external service"]
